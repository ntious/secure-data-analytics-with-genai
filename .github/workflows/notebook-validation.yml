name: Notebook validation

on:
  push:
    paths:
      - "**/*.ipynb"
      - "**/*.py"
      - ".github/workflows/notebook-validation.yml"
  pull_request:
    paths:
      - "**/*.ipynb"
      - "**/*.py"
      - ".github/workflows/notebook-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check nbformat==5.10.4

      - name: Validate notebook JSON and compile Python code cells
        shell: python
        run: |
          from __future__ import annotations

          import ast
          import pathlib
          import re
          import sys

          import nbformat

          failures = []
          for path in pathlib.Path(".").rglob("*.ipynb"):
              if ".ipynb_checkpoints" in path.parts:
                  continue
              try:
                  notebook = nbformat.read(path, as_version=4)
                  nbformat.validate(notebook)
                  for index, cell in enumerate(notebook.cells, start=1):
                      if cell.cell_type != "code":
                          continue
                      source = re.sub(r"(?m)^(\s*)%{1,2}.*$", r"\1pass", cell.source)
                      source = re.sub(r"(?m)^(\s*)!.*$", r"\1pass", source)
                      ast.parse(source, filename=f"{path}:cell-{index}")
              except Exception as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures), file=sys.stderr)
              raise SystemExit(1)

      - name: Check Python syntax
        run: python -m compileall -q .
